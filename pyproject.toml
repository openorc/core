[project]
name = "openorc"
description = "OpenOrc control plane: open, provider-neutral orchestration for governed agentic software development."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dynamic = ["version"]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "rq==2.12.0",
    "redis==8.1.0",
    "psycopg[binary]==3.3.5",
    "psycopg-pool==3.3.1",
    "PyJWT[crypto]==2.14.0",
    # Application observability (issue #108): vendor-neutral OpenTelemetry
    # foundation with OTLP as the export boundary. Latest stable release at
    # implementation time, verified on PyPI (2026-09-22).
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[project.urls]
Homepage = "https://github.com/openorc/core"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
    "pyright==1.1.414",
    # Direct dev dependency: the JWT/JWKS tests import cryptography directly
    # to generate ES256/RSA keypairs for deterministic verifier tests.
    "cryptography==50.0.1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/openorc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openorc"]

[tool.uv]
required-version = "==0.10.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not integration'"
markers = [
    "integration: requires live external infrastructure; excluded from the ordinary deterministic baseline",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "apps", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
